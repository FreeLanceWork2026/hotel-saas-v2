name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC (well within the 7-day pause window)
    - cron: "0 8 */5 * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Supabase via App Route
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /api/keep-alive
        run: |
          echo "Pinging app to keep Supabase alive..."

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://neil-lewz-v1.yt-personalacc2026.workers.dev/api/keep-alive")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response body: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase is alive and responding."
          else
            echo "❌ Unexpected response: $HTTP_STATUS"
            exit 1
          fi
